name: Build and Publish

# Thin caller around the shared reusable workflow in
# xnatworks/xnat-ci-workflows. Publishes maven artifacts to GitHub Packages
# with the exact version from build.gradle; only long-lived branches
# (master/main/develop/releases/*) publish, other branches just build.

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      publish_packages:
        description: 'Publish artifacts to GitHub Packages'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write   # publish to GitHub Packages

jobs:
  build-publish:
    uses: xnatworks/xnat-ci-workflows/.github/workflows/gradle-build-publish.yml@v1
    with:
      # ──── Gradle ────
      # xnatPluginJar (the -xpl deployment jar) is not wired into `build`
      gradle-build-task: 'build xnatPluginJar'

      # ──── Artifact ────
      artifact-glob: 'build/libs/*-xpl.jar'
      artifact-name: 'fnirs-plugin-jar'

      # ──── GitHub Packages ────
      # On any push: publish. On dispatch: only when publish_packages ticked.
      publish-packages: ${{ github.event_name == 'push' || inputs.publish_packages }}

    secrets: inherit
